packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

ignoredBuiltDependencies:
  - '@scarf/scarf'
  - core-js
  - core-js-pure

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@swc/core'
  - bufferutil
  - esbuild
  - keccak
  - protobufjs
  - sharp
  - utf-8-validate
